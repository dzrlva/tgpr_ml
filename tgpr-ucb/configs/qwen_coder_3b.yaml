model:
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"
  type: "dense"

training:
  batch_size: 2
  grad_accum: 8
  max_prompt_len: 2048
  max_gen_len: 1024
  group_size: 8
  lr: 1e-6
  kl_coef: 0.01
  epochs: 3

tree:
  max_nodes: 64
  exploration_const: 1.414
  max_depth: 5

reward:
  weights: [0.3, 0.5, 0.2]
  beta: 1.0
  corpus_path: "data/validated_corpus.jsonl"

rollout:
  backend: "vllm"
  temperature: 0.7
  top_p: 0.9
